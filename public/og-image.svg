<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lightBeamRight" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Stadium Lights -->
  <polygon points="0,0 450,630 150,630" fill="url(#lightBeam)" />
  <polygon points="1200,0 750,630 1050,630" fill="url(#lightBeamRight)" />

  <!-- Floodlight poles abstract -->
  <circle cx="100" cy="50" r="18" fill="#ffffff" opacity="0.8" />
  <circle cx="1100" cy="50" r="18" fill="#fef08a" opacity="0.8" />

  <!-- Stadium Crowd Silhouette at bottom -->
  <path d="M 0 540 Q 300 510 600 530 T 1200 520 L 1200 630 L 0 630 Z" fill="#050811" />
  <path d="M 0 570 Q 400 540 800 560 T 1200 550 L 1200 630 L 0 630 Z" fill="#020408" opacity="0.8" />

  <!-- Center Badge -->
  <rect x="360" y="70" width="480" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="600" y="96" fill="#38bdf8" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="3" text-anchor="middle">
    THE UNOFFICIAL INDIAN CRICKET FANS' THERAPY CENTER
  </text>

  <!-- Big Title -->
  <text x="600" y="210" fill="url(#textGrad)" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="88" letter-spacing="4" text-anchor="middle">
    19 NOVEMBER
  </text>

  <!-- Subtitle -->
  <text x="600" y="270" fill="#f87171" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="2" text-anchor="middle">
    10 WINS. 1 FINAL. STILL NOT RECOVERED.
  </text>

  <!-- Scoreboard Box -->
  <g transform="translate(250, 310)" filter="url(#cardGlow)">
    <rect width="700" height="150" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <line x1="350" y1="20" x2="350" y2="130" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- India side -->
    <text x="175" y="55" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" letter-spacing="2" text-anchor="middle">INDIA</text>
    <text x="175" y="105" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="800" text-anchor="middle">240 <tspan font-size="20" fill="#94a3b8">ALL OUT</tspan></text>
    
    <!-- Australia side -->
    <text x="525" y="55" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600" letter-spacing="2" text-anchor="middle">AUSTRALIA</text>
    <text x="525" y="105" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="42" font-weight="800" text-anchor="middle">241/4 <tspan font-size="20" fill="#94a3b8">(43 OV)</tspan></text>
  </g>

  <!-- Footer Tagline -->
  <text x="600" y="510" fill="#94a3b8" font-family="sans-serif" font-size="18" text-anchor="middle">
    Trauma Assessment • Memory Quiz • Meme Therapy • Healing Meter
  </text>
  <text x="600" y="590" fill="#64748b" font-family="sans-serif" font-size="14" letter-spacing="1" text-anchor="middle">
    A tribute to the 10-0 dream run &amp; a safe space to laugh about the heartbreak.
  </text>
</svg>
